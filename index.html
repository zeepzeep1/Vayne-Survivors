<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vayne Survivors</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="game-shell">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>

      <div id="hud">
        <div id="topbar">
          <div id="brand">VAYNE SURVIVORS</div>
          <div id="goldWrap">
            <span id="goldText">0</span>
            <span class="goldIcon">🪙</span>
          </div>
        </div>

        <div id="bars">
          <div class="bar-row">
            <span>HP</span>
            <div class="bar">
              <div id="hpFill" class="fill hp-fill"></div>
            </div>
            <b id="hpText">100 / 100</b>
          </div>

          <div class="bar-row">
            <span>XP</span>
            <div class="bar">
              <div id="xpFill" class="fill xp-fill"></div>
            </div>
            <b id="lvlText">LVL 1</b>
          </div>
        </div>

        <div id="controls">
          <span>WASD = mover</span>
          <span>SPACE = dash</span>
          <span>F = tienda</span>
          <span>P = pausa</span>
        </div>
      </div>

      <div id="messageBox" class="hidden"></div>

      <div id="startScreen" class="screen">
        <div class="panel">
          <h1>VAYNE SURVIVORS</h1>
          <p>Sobrevive a la Grieta, acumula oro y mejora a la cazadora.</p>
          <button id="startBtn">INICIAR PARTIDA</button>
        </div>
      </div>

      <div id="pauseScreen" class="screen hidden">
        <div class="panel compact">
          <h2>PAUSA</h2>
          <button id="resumeBtn">CONTINUAR</button>
        </div>
      </div>

      <div id="gameOverScreen" class="screen hidden">
        <div class="panel compact">
          <h2>FIN DE LA PARTIDA</h2>
          <p id="finalStats">Tu puntuación: 0</p>
          <button id="restartBtn">REINICIAR</button>
        </div>
      </div>

      <div id="shopScreen" class="screen hidden">
        <div class="panel shop-panel">
          <h2>MERCADER</h2>
          <div class="shop-list">
            <button class="shop-item" data-upgrade="damage">+10% daño</button>
            <button class="shop-item" data-upgrade="speed">+10% velocidad</button>
            <button class="shop-item" data-upgrade="hp">+15 max HP</button>
            <button class="shop-item" data-upgrade="crit">+5% crítico</button>
          </div>
          <button id="closeShopBtn">CERRAR</button>
        </div>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
